name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo run --quiet -- run examples/hello.rg
      - run: cargo run --quiet -- run examples/class_trait.rg
      - run: cargo run --quiet -- run examples/io_time.rg
      - run: cargo run --quiet -- run examples/process.rg hello
      - run: cargo run --quiet -- run examples/tour.rg
      - run: cargo run --quiet -- run examples/json.rg
      - run: cargo run --quiet -- run examples/signals.rg
      - run: cargo run --quiet -- test examples/tests.rg

  vscode-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test vscode/scan.test.js
